services:
  web:
    build:
      context: .
      target: app
    container_name: community_mcp_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # Default to containerized ollama service
      - OLLAMA_BASE_URL=http://ollama:11434
      # Local-model guardrails (see README "Local model performance")
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-512}
      - LOCAL_TOOL_OUTPUT_MAX_BYTES=${LOCAL_TOOL_OUTPUT_MAX_BYTES:-4000}
      - LOCAL_HISTORY_MAX_TURNS=${LOCAL_HISTORY_MAX_TURNS:-6}
      - LOCAL_DIRECT_LIST_ANSWERS=${LOCAL_DIRECT_LIST_ANSWERS:-true}
    depends_on:
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount the .env file so modifications take effect inside the running container
      - .env:/app/.env
      # Mount the web folder so frontend changes reflect immediately
      - ./web:/app/web
      # Persist chat sessions across container rebuilds
      - mcp_sessions:/root/.mcp
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      # Keep the model in RAM instead of unloading after 5 idle minutes
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      # Default 4096 is too small for tool schemas + tool results
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      # Flash attention / q8_0 KV cache measured ~15% slower on CPU-only; enable with a GPU
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-0}
      # One slot and one model: all CPU/RAM goes to a single request, and the
      # stable system prompt + tool prefix stays in the prompt cache
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  # One-shot: pull the configured model so the first chat doesn't wait on a download
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama_data:
  mcp_sessions:
